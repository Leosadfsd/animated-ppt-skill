name: Python animation checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/preview.test.mjs
      - run: python skills/script-to-animated-ppt/scripts/animate.py inspect examples/walking/output/Walking_Animated_Demo.pptx
      - run: python skills/script-to-animated-ppt/scripts/scene.py validate examples/collage/scene.json
      - run: python skills/script-to-animated-ppt/scripts/animate.py inspect examples/collage/output/Walking_Collage_Animated_v02.pptx
